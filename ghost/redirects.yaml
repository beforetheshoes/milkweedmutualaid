# Ghost redirects — upload in Ghost Admin: Settings → Labs → Redirects.
#
# Ghost compiles each key as a regex and appends /?$ but does NOT anchor the
# start, so every key begins with ^ to stop it matching mid-path.
#
# 1. New permalinks (see routes.yaml) → the same path on the public site.
# 2. Each post's old /<slug>/ permalink, so links in past newsletters and
#    shares keep working. Exact slugs only — never a catch-all — so /, /members,
#    /unsubscribe, /ghost, /p, /email, /r and /content are never touched.
#    New posts get the new permalinks and need no entry here.
#
# 302, not 301: Ghost serves custom 301s with Cache-Control max-age=31536000
# (caching.customRedirects.maxAge), so a browser that followed one would keep
# it for a year even if this file were rolled back. 302s go out with max-age=0.
# Promote to 301 once this has been live for a while, if wanted.
302:
  ^/(en|es)/blog/([^/]+): https://milkweedmutualaid.org/$1/blog/$2
  ^/(en|es)/blog: https://milkweedmutualaid.org/$1/blog
