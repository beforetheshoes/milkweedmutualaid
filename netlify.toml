[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.6.5"

# Ghost-hosted uploads (images, media, files). Ghost builds these URLs from its
# `url` config, so pointing that at this domain makes them resolve here instead
# of the Ghost host. Proxy them back, ahead of the SPA fallback below — that
# catch-all would otherwise answer them with index.html and a 200, breaking
# images with no 404 to signal it.
[[redirects]]
  from = "/content/*"
  to = "https://ghost.milkweedmutualaid.org/content/:splat"
  status = 200

# Posts that aren't built yet. A newsletter goes out the moment a post is
# published, but the rebuild that publish triggers takes minutes; until it lands
# this serves a "post on its way" page (with a 404) that reloads itself once the
# real page exists. Built posts are files, and files shadow these rules, so only
# missing paths reach them.
[[redirects]]
  from = "/en/blog/*"
  to = "/post-pending.html"
  status = 404

[[redirects]]
  from = "/es/blog/*"
  to = "/post-pending.html"
  status = 404

# SPA fallback — serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/milkweedlogo*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
